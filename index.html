</html><!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Majhya Rani Sathi 💝</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Dancing+Script:wght@700&family=Anek+Devanagari:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #ff4d94; --bg: #fff5f8; }
        body { margin: 0; padding: 0; background: var(--bg); font-family: 'Poppins', 'Anek Devanagari', sans-serif; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }

        .bg-heart { position: absolute; color: rgba(255, 77, 148, 0.2); pointer-events: none; z-index: 0; animation: floatUp 5s infinite linear; }
        @keyframes floatUp { 0% { transform: translateY(110vh) scale(0); opacity: 0; } 100% { transform: translateY(-10vh) scale(1.5); opacity: 0; } }

        #welcome-box { width: 85%; max-width: 380px; background: white; border-radius: 35px; padding: 35px; box-shadow: 0 15px 40px rgba(255, 77, 148, 0.2); text-align: center; z-index: 10; border: 2px solid #ffdeeb; }
        .panda { font-size: 80px; animation: bounce 2s infinite; display: inline-block; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }

        #storybook { display: none; position: fixed; inset: 0; background: #000; z-index: 20; }
        .slide { position: absolute; inset: 8vh 7vw; background: #1a1a1a; border-radius: 30px; overflow: hidden; border: 2px solid var(--primary); transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1); }
        .slide img { width: 100%; height: 70%; object-fit: cover; }
        .slide-footer { height: 30%; background: linear-gradient(135deg, #ff4d94, #d81b60); display: flex; align-items: center; padding: 15px; color: white; text-align: center; font-size: 1.1rem; justify-content: center; font-weight: 500; }

        #final-screen { display: none; position: fixed; inset: 0; background: #fff; padding: 30px 20px; flex-direction: column; align-items: center; text-align: center; z-index: 30; overflow-y: auto; }
        .wish-container { font-size: 1.1rem; line-height: 1.6; color: #333; margin-top: 15px; font-weight: 500; text-align: justify; padding: 15px; background: #fffafb; border-radius: 20px; }
        
        /* Final Photo Frame */
        #final-photo { width: 180px; height: 180px; border-radius: 50%; border: 5px solid var(--primary); object-fit: cover; margin-top: 20px; display: none; box-shadow: 0 10px 20px rgba(255, 77, 148, 0.3); animation: zoomIn 1s ease-out; }
        @keyframes zoomIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .btn { background: var(--primary); color: white; border: none; padding: 12px 25px; border-radius: 30px; font-weight: bold; margin-top: 20px; cursor: pointer; font-size: 0.9rem; }
    </style>
</head>
<body>

<div id="welcome-box">
    <div class="panda">🐼</div>
    <h2 style="color: var(--primary); margin: 15px 0;">hey Prashant happy birthday 🎂🎈! 💖</h2>
    <p style="color: #666;">me SHRINIVAS RATHOD tula tuzya vaddivsacya shubhecha deto Happy Birthday Prashant khalil button var click kar ! ❤️</p>
    <button class="btn" onclick="startStory()">Prashant click now ! 🥰</button>
</div>

<div id="storybook">
    <div id="cards-container">
        <div class="slide" data-msg="तुझा वाढदिवस माझ्यासाठी खूप खास आहे, कारण तू माझ्या आयुष्यातील एक अनमोल भेट आहेस. तुला वाढदिवसाच्या शुभेच्छा! 🥳 . ❤️"><img src="8.jpg"><div class="slide-footer"><div class="sh"></div></div></div>
        <div class="slide" data-msg="तुझ्यासारखा मित्र मिळणे हे भाग्याचे लक्षण आहे, तुझ्या मैत्रीची किंमत शब्दात सांगता येणार नाही. वाढदिवसाच्या खूप साऱ्या शुभेच्छा! 🥰"><img src="7.jpg"><div class="slide-footer"><div class="sh"></div></div></div>
        <div class="slide" data-msg="तुझ्या चेहऱ्यावरचे हास्य कधीही कमी होऊ नये, तुझ्या आयुष्यात फक्त आनंदच आनंद असो, माझ्या जिवाभावाच्या मित्रा, हॅपी बर्थडे!✨"><img src="6.jpg"><div class="slide-footer"><div class="sh"></div></div></div>
        <div class="slide" data-msg="वाढदिवसाच्या या खास दिवशी, तुला जगातील सर्व सुख, समाधान आणि यश मिळो, अशी माझी देवाकडे प्रार्थना आहे.. 💍"><img src="5.jpg"><div class="slide-footer"><div class="sh"></div></div></div>
        <div class="slide" data-msg="आपल्या मैत्रीचे बंध असेच घट्ट राहोत, जीवनाच्या प्रत्येक वळणावर तू यशस्वी हो आणि तुझ्या सर्व इच्छा पूर्ण होवोत, हीच सदिच्छा!🌹"><img src="4.jpg"><div class="slide-footer"><div class="sh"></div></div></div>
        <div class="slide" data-msg="तू केवळ मित्र नाहीस, तर माझा आधारस्तंभ आहेस, तुझ्यासारखा मित्र मिळाल्याबद्दल मी स्वतःला भाग्यवान समजतो. वाढदिवसाच्या शुभेच्छा!. 🤝"><img src="3.jpg"><div class="slide-footer"><div class="sh"></div></div></div>
        <div class="slide" data-msg="ज्या मैत्रीने माझ्या आयुष्याला एक नवी दिशा दिली, त्या मित्राला वाढदिवसाच्या खूप साऱ्या शुभेच्छा! 🎂. ❤️"><img src="2.jpg"><div class="slide-footer"><div class="sh"></div></div></div>
        <div class="slide" data-msg="माझ्या प्रिय मित्रा, तुला वाढदिवसाच्या हार्दिक शुभेच्छा! 🎉 तुझा आजचा दिवस आणि येणारे वर्ष तुझ्या आयुष्यात खूप आनंद आणि समाधान घेऊन येवो 💝"><img src="1.jpg"><div class="slide-footer"><div class="sh"></div></div></div>
    </div>
    <p id="hint" style="position:fixed; bottom:30px; width:100%; text-align:center; color:white; opacity:0.7;">Swipe Left </p>
</div>

<div id="final-screen">
    <img src="1.jpg" id="final-photo">
    <h1 style="font-family: 'Dancing Script', cursive; color: var(--primary); font-size: 2.2rem; margin: 10px 0;">Happy Birthday prashant jaan!</h1>
    <div id="main-wish" class="wish-container"></div>
    <p id="voice-status" style="font-size: 0.8rem; color: #ff85a2; margin-top: 10px;">(आवाज ऐकण्यासाठी इथे टच करा 👆💖)</p>
    <button class="btn" onclick="location.reload()">परत बघूया❤️</button>
</div>

<script>
    const finalLetter =
    " मित्रा, तुला वाढदिवसाच्या खूप खूप शुभेच्छा! तुझा वाढदिवस आनंद, प्रेम आणि हास्याने भरलेला असो, तुझ्या आयुष्यातील प्रत्येक स्वप्न पूर्ण होवो, तू नेहमी आनंदी राहा, तुझ्या मैत्रीमुळे माझे आयुष्य समृद्ध झाले आहे, तू माझा खरा आधार आहेस, तुझ्यासोबतचे क्षण अविस्मरणीय आहेत, देव तुला उत्तम आरोग्य आणि यश देवो, तुझ्या सर्व इच्छा पूर्ण होवोत, तुझी मैत्री अशीच कायम राहो! happy birthday re Prashant ❤️";

    const slides = Array.from(document.querySelectorAll('.slide'));
    let slideIdx = slides.length - 1;
    let isTyping = false;
    let voiceStarted = false;

    setInterval(() => {
        const h = document.createElement('div');
        h.className = 'bg-heart'; h.innerHTML = '❤️';
        h.style.left = Math.random() * 100 + 'vw';
        h.style.animationDuration = (Math.random() * 2 + 3) + 's';
        document.body.appendChild(h);
        setTimeout(() => h.remove(), 5000);
    }, 600);

    function startStory() {
        document.getElementById("welcome-box").style.display = "none";
        document.getElementById("storybook").style.display = "block";
        typeText(slides[slideIdx]);
    }

    function typeText(s) {
        isTyping = true;
        document.getElementById("hint").style.opacity = 0.2;
        const target = s.querySelector('.sh');
        const msg = s.getAttribute('data-msg');
        target.innerHTML = ""; let i = 0;
        const timer = setInterval(() => {
            if(i < msg.length) { target.innerHTML += msg.charAt(i); i++; }
            else { clearInterval(timer); isTyping = false; document.getElementById("hint").style.opacity = 0.8; }
        }, 55);
    }

    let sX = 0;
    document.addEventListener('touchstart', e => sX = e.touches[0].clientX);
    document.addEventListener('touchend', e => {
        if(document.getElementById('storybook').style.display === "block" && !isTyping) {
            if (sX - e.changedTouches[0].clientX > 60) swipe();
        }
    });

    function swipe() {
        const s = slides[slideIdx];
        s.style.transform = "translateX(-150vw) rotate(-15deg)";
        slideIdx--;
        if (slideIdx >= 0) setTimeout(() => typeText(slides[slideIdx]), 600);
        else showFinal();
    }

    function playVoice() {
        if (voiceStarted) return;
        window.speechSynthesis.cancel(); 
        const speech = new SpeechSynthesisUtterance(finalLetter);
        let voices = window.speechSynthesis.getVoices();
        let maleVoice = voices.find(v => (v.name.includes('Male') || v.name.includes('Google मराठी')) && v.lang.includes('mr'));
        if(maleVoice) speech.voice = maleVoice;
        speech.lang = 'mr-IN'; 
        speech.rate = 0.80; 
        speech.pitch = 0.8;
        window.speechSynthesis.speak(speech);
        voiceStarted = true;
        document.getElementById('voice-status').style.opacity = "0";
    }

    function showFinal() {
        document.getElementById('storybook').style.display = "none";
        document.getElementById('final-screen').style.display = "flex";
        
        document.getElementById('final-screen').addEventListener('click', playVoice);

        const target = document.getElementById("main-wish");
        let i = 0;
        const timer = setInterval(() => {
            if(i < finalLetter.length) { target.innerHTML += finalLetter.charAt(i); i++; }
            else { 
                clearInterval(timer);
                document.getElementById('final-photo').style.display = "block"; // Show photo after text
            }
        }, 60);
    }
</script>
</body>
</html>
